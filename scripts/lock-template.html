    <script>
        // Theme, matching the rest of the site.
        function toggleTheme() {
            var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
            try { localStorage.setItem('theme', t); } catch (e) {}
            updateToggleIcons(t);
        }
        function updateToggleIcons(theme) {
            var sun = document.querySelector('.sun-icon'), moon = document.querySelector('.moon-icon');
            if (!sun || !moon) return;
            sun.style.display = theme === 'light' ? 'none' : 'block';
            moon.style.display = theme === 'light' ? 'block' : 'none';
        }
        try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}

        (function () {
            var P = {{PAYLOAD}};
            var KEY_STORE = 'unlock-{{NAME}}';
            var form = document.getElementById('unlock'), input = document.getElementById('pw'),
                err = document.getElementById('err'), btn = form.querySelector('button');

            function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
            function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

            function deriveKey(password) {
                return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
                    .then(function (base) {
                        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.it, hash: 'SHA-256' },
                            base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
                    });
            }
            function open(key) {
                return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)).then(function (plain) {
                    var html = new TextDecoder().decode(plain);
                    document.open(); document.write(html); document.close();
                    return key;
                });
            }
            function remember(key) {
                return crypto.subtle.exportKey('raw', key).then(function (raw) {
                    try { sessionStorage.setItem(KEY_STORE, b64(raw)); } catch (e) {}
                });
            }

            // Already unlocked in this tab session: skip the prompt.
            var saved = null;
            try { saved = sessionStorage.getItem(KEY_STORE); } catch (e) {}
            if (saved) {
                crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(open)
                    .catch(function () { try { sessionStorage.removeItem(KEY_STORE); } catch (e) {} });
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                err.textContent = '';
                btn.disabled = true;
                btn.textContent = 'Unlocking…';
                deriveKey(input.value)
                    .then(function (key) { return remember(key).then(function () { return open(key); }); })
                    .catch(function () {
                        try { sessionStorage.removeItem(KEY_STORE); } catch (e) {}
                        err.textContent = 'That password is not correct.';
                        btn.disabled = false;
                        btn.textContent = 'Unlock';
                        input.select();
                    });
            });
        })();
